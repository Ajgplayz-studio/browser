<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sites</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:transparent;color:#e8eaed;font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
  .site{padding:2px 0}
  .domain{display:inline-block;background:#35363a;border:1px solid #3c4043;border-radius:8px;padding:2px 9px;font-family:Consolas,monospace;font-size:14px;color:#e8eaed}
  p{margin:10px 0 0;color:#9aa0a6;line-height:1.55;font-size:15px}
  p b{color:#e8eaed}
</style>
</head>
<body>
  <div class="site">
    <span class="domain">start.com</span>
    <p>That's <b>this exact start page</b> — the one you're looking at right now.
    start.com is this browser's home page: the first page it opens, and the page the 🏠 button
    always brings you back to.</p>
  </div>
</body>
</html>
